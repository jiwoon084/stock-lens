server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GCE deploy only opens port 80 at the firewall (see infra/gcp-setup.md) — the backend
    # container isn't exposed externally at all. The frontend image is built with
    # VITE_API_BASE_URL="" (relative), so browser calls to /api/... hit this same origin and
    # get proxied here to the backend container over the compose network.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
