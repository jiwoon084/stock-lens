name: Deploy

# GCE + GHCR, not Cloud Run: builds both images, pushes them to GitHub Container Registry, then
# SSHes into the reused GCE VM (see infra/gcp-setup.md) to pull and restart via
# infra/gce/docker-compose.yml, which already lives on that VM at ~/stock-lens/docker-compose.yml.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stock-lens-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stock-lens-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          # Relative (same-origin): nginx.conf proxies /api/ to the backend container over the
          # compose network, so the built SPA should call its own origin, not a baked-in host.
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Deploy to GCE over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_KEY }}
          script: |
            set -e
            cd ~/stock-lens
            docker compose pull
            docker compose up -d
            docker image prune -f

            for i in $(seq 1 10); do
              if curl -sf http://127.0.0.1:8001/health > /dev/null; then
                echo "Backend healthy"
                break
              fi
              echo "Waiting for backend... ($i)"
              sleep 5
              if [ "$i" = "10" ]; then
                echo "Backend health check failed"
                exit 1
              fi
            done

            curl -sf http://127.0.0.1/ > /dev/null && echo "Frontend serving"
